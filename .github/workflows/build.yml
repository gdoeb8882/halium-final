name: Build Halium Boot Image (Exact Fix)
on: [push, workflow_dispatch]
jobs:
  build-boot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git debootstrap qemu-user-static binfmt-support cpio gzip

      - name: Build Initramfs
        run: |
          git clone https://github.com/Halium/initramfs-tools-halium.git
          cd initramfs-tools-halium
          
          # 1. إصلاح الإصدار والأدوات
          sed -i 's/stretch/bookworm/g' build-initrd.sh
          sed -i 's/qemu-debootstrap/debootstrap/g' build-initrd.sh
          
          # 2. حقن الأمر في السطر الصحيح الذي يظهر في سجلك
          # نبحث عن update-initramfs -c -k touch-arm64 ونضع قبله إنشاء الملف
          sed -i 's/update-initramfs -c -k touch-arm64/mkdir -p \/boot \&\& echo "CONFIG_RD_GZIP=y" > \/boot\/config-touch-arm64 \&\& update-initramfs -c -k touch-arm64/' build-initrd.sh
          
          chmod +x build-initrd.sh
          sudo RELEASE=bookworm ./build-initrd.sh -a arm64

      - name: Download Kernel
        run: |
          wget https://github.com/gdoeb8882/halium-final/releases/download/v1.0-gki6.6/halium-kernel.zip
          unzip -j halium-kernel.zip -d kernel_dir

      - name: Create Boot Image
        run: |
          KERNEL_PATH=$(find kernel_dir -name "Image" -type f | head -n 1)
          if [ -z "$KERNEL_PATH" ]; then
            echo "خطأ: لم يتم العثور على ملف Image"
            exit 1
          fi
          
          mkbootimg --kernel "$KERNEL_PATH" \
                    --ramdisk initramfs-tools-halium/out/initrd.img-touch-arm64 \
                    --header_version 4 \
                    --pagesize 4096 \
                    --output halium-boot.img
          
          if [ ! -s halium-boot.img ]; then
            echo "خطأ: ملف halium-boot.img فارغ!"
            exit 1
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-halium-boot-final
          name: Halium Boot Image (Final)
          files: halium-boot.img
